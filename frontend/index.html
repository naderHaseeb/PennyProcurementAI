<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procurement Intelligence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Procurement Intelligence</h1>
      <p>AI-Powered California Procurement Assistant</p>
    </header>

    <main id="messages">
      <div class="message assistant">
        Welcome! Ask me about California procurement data from 2012–2015.
      </div>
    </main>

    <form id="chat-form">
      <input id="question" type="text"
             placeholder="Ask a procurement question..."
             maxlength="500" required>
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
